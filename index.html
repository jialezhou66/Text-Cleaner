<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Cleaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "Segoe UI", "PingFang SC", "Microsoft YaHei", "sans-serif"],
            mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "Consolas", "monospace"],
          },
          boxShadow: {
            soft: "0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06)",
            "soft-dark": "0 1px 2px rgba(0, 0, 0, 0.24), 0 12px 32px rgba(0, 0, 0, 0.28)",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }
    textarea { field-sizing: content; }
    .pane-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .pane-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 999px; }
    .dark .pane-scroll::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.7); }
    #toast { opacity: 0; transform: translate(-50%, -8px); transition: opacity 0.2s ease, transform 0.2s ease; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body class="h-full bg-[#f4f5f7] text-slate-800 antialiased dark:bg-[#0b0c0e] dark:text-zinc-100">
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-indigo-400/20 blur-3xl dark:bg-indigo-500/10"></div>
    <div class="absolute -bottom-28 -right-16 h-80 w-80 rounded-full bg-violet-300/20 blur-3xl dark:bg-violet-600/10"></div>
  </div>

  <div class="relative mx-auto flex min-h-full max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6 flex items-start justify-between gap-4">
      <div>
        <div class="mb-2 inline-flex items-center gap-2 rounded-full border border-slate-200/80 bg-white/70 px-3 py-1 text-[11px] font-medium tracking-wide text-slate-500 shadow-soft backdrop-blur dark:border-white/10 dark:bg-white/5 dark:text-zinc-400 dark:shadow-none">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
          本地纯前端 · 无需安装
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white sm:text-3xl">Text Cleaner</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-zinc-400">极简文本清理助手 · 压缩空行、整理空格、合并断句、智能分段、去掉 AI 前缀符号</p>
      </div>
      <button id="themeToggle" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white/80 text-slate-600 shadow-soft transition hover:bg-white dark:border-white/10 dark:bg-white/5 dark:text-zinc-300 dark:shadow-none dark:hover:bg-white/10" aria-label="切换主题" title="切换浅色 / 深色">
        <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25M12 18.75V21m9-9h-2.25M5.25 12H3m15.364 6.364-1.591-1.591M7.227 7.227 5.636 5.636m12.728 0-1.591 1.591M7.227 16.773l-1.591 1.591M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
        <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" /></svg>
      </button>
    </header>

    <section class="mb-5 rounded-2xl border border-slate-200/80 bg-white/70 p-3 shadow-soft backdrop-blur dark:border-white/10 dark:bg-[#121417]/80 dark:shadow-soft-dark sm:p-4">
      <div class="mb-2 flex items-center justify-between px-1">
        <span class="text-xs font-medium uppercase tracking-wider text-slate-400 dark:text-zinc-500">处理操作</span>
        <span class="text-xs text-slate-400 dark:text-zinc-500">连续点按钮会接着处理右侧结果，不用来回复制</span>
      </div>
      <div id="actionBar" class="flex flex-wrap gap-2"></div>
    </section>

    <main class="grid flex-1 grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-5">
      <section class="flex min-h-[420px] flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-soft dark:border-white/10 dark:bg-[#121417] dark:shadow-soft-dark">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 dark:border-white/10">
          <div>
            <h2 class="text-sm font-semibold text-slate-800 dark:text-zinc-100">原始文本</h2>
            <p id="inputMeta" class="text-xs text-slate-400 dark:text-zinc-500">0 字 · 0 行</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="pasteBtn" type="button" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 transition hover:bg-slate-50 dark:border-white/10 dark:bg-white/5 dark:text-zinc-300 dark:hover:bg-white/10">从剪贴板粘贴</button>
            <button id="undoBtn" type="button" disabled class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-500 transition hover:bg-slate-50 hover:text-slate-800 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-500 dark:text-zinc-400 dark:hover:bg-white/5 dark:hover:text-zinc-200 dark:disabled:hover:text-zinc-400">撤回</button>
            <button id="clearBtn" type="button" class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-500 transition hover:bg-slate-50 hover:text-slate-800 dark:text-zinc-400 dark:hover:bg-white/5 dark:hover:text-zinc-200">清空</button>
          </div>
        </div>
        <textarea id="inputText" class="pane-scroll min-h-0 flex-1 resize-none bg-transparent px-4 py-3 font-mono text-[13px] leading-6 text-slate-700 outline-none placeholder:text-slate-400 dark:text-zinc-200 dark:placeholder:text-zinc-600" placeholder="在此粘贴需要清理的文本…" spellcheck="false"></textarea>
      </section>
      <section class="flex min-h-[420px] flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-soft dark:border-white/10 dark:bg-[#121417] dark:shadow-soft-dark">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 dark:border-white/10">
          <div>
            <h2 class="text-sm font-semibold text-slate-800 dark:text-zinc-100">处理后文本</h2>
            <p id="outputMeta" class="text-xs text-slate-400 dark:text-zinc-500">0 字 · 0 行</p>
          </div>
          <button id="copyBtn" type="button" class="rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-indigo-500">一键复制</button>
        </div>
        <textarea id="outputText" class="pane-scroll min-h-0 flex-1 resize-none bg-transparent px-4 py-3 font-mono text-[13px] leading-6 text-slate-700 outline-none placeholder:text-slate-400 dark:text-zinc-200 dark:placeholder:text-zinc-600" placeholder="处理后的结果会显示在这里，也可以直接微调。" spellcheck="false"></textarea>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed left-1/2 top-6 z-50 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-soft dark:border-white/20 dark:bg-white dark:text-slate-900">已复制</div>

  <script>
    (function () {
      var root = document.documentElement;
      var inputEl = document.getElementById("inputText");
      var outputEl = document.getElementById("outputText");
      var toastEl = document.getElementById("toast");
      var toastTimer, hasPipeline = false, inputSnapshot = "", aiDecorations = [], history = [];
      var CN_NUM = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
      var PREFIX_RES = [
        /^(#{1,6}\s+)/, /^(>\s?)/, /^([-*+•●○▪►▶·]\s+)/, /^(\[[ xX]\]\s+)/,
        /^(?:第?[0-9０-９]+|[ivxlcdmIVXLCDM]+)[.)、]\s*/, /^[（(][0-9０-９]+[）)]\s*/,
        /^[A-Za-z][.)]\s*/, /^[一二三四五六七八九十百千]+[、.．]\s*/
      ];
      var KEYWORD_RE = /(?:问题|答案|背景|目标|步骤|总结|备注|结论|分析|建议|注意|提示|案例|示例)[0-9]{0,2}[：:]|(?:\b(?:Step|STEP)\s*[0-9]{1,2}\b)/g;
      var BTN = "inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:-translate-y-px hover:border-slate-300 hover:shadow dark:border-white/10 dark:bg-white/5 dark:text-zinc-200 dark:hover:bg-white/10";
      var BTN_PRIMARY = "inline-flex items-center gap-2 rounded-xl bg-slate-900 px-3.5 py-2 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-px hover:bg-slate-800 dark:bg-white dark:text-slate-900 dark:hover:bg-zinc-200";

      function $(id) { return document.getElementById(id); }
      function normalizeNewlines(text) { return String(text || "").replace(/\r\n?/g, "\n"); }
      function linesOf(text) { return normalizeNewlines(text).split("\n"); }
      function mapLines(text, fn) { return linesOf(text).map(fn).join("\n"); }
      function trimLine(line) { return line.replace(/^\s+|\s+$/g, ""); }
      function compactSpaces(line) { return line.replace(/[ \t\u3000]+/g, " "); }
      function normKey(s) { return String(s || "").replace(/\s+/g, " ").trim(); }
      function isBlankLine(line) { return line.replace(/[ \t\u3000]/g, "") === ""; }
      function looksLikeBlockStart(line) {
        return /^(#{1,6}\s|[-*+•●○▪►▶]\s|\d+[.)、]\s|[（(]\d+[）)]\s|>\s|```)/.test(line);
      }

      function isTitleHeading(s) {
        s = String(s || "").replace(/[:：]\s*$/, "").trim();
        if (s.length < 2 || s.length > 70) return false;
        if (/[.!?。！？,，;；]/.test(s)) return false;
        var words = s.split(/\s+/).filter(Boolean);
        if (!words.length || words.length > 12) return false;
        if (words.length === 1) return /^(?:[A-Z][A-Za-z'’-]{1,24}|[A-Z]{2,8}|[\u4e00-\u9fff]{2,16})$/.test(words[0]);
        var small = /^(?:a|an|the|of|in|on|to|for|and|&|or|as|at|by)$/i;
        var real = 0, caps = 0, i, w;
        for (i = 0; i < words.length; i++) {
          w = words[i].replace(/^[^A-Za-z\u4e00-\u9fff]+|[^A-Za-z\u4e00-\u9fff]+$/g, "");
          if (!w) continue;
          if (small.test(w) && i > 0) continue;
          real += 1;
          if (/^[A-Z\u4e00-\u9fff]/.test(w)) caps += 1;
        }
        return real > 0 && caps >= real;
      }

      function looksLikeHeading(line) {
        var s = trimLine(String(line || ""));
        if (!s) return false;
        if (looksLikeBlockStart(s)) return true;
        if (/^(?:#{1,6}\s+|第[一二三四五六七八九十百千0-9]+[、.．\s]|[（(]\d+[）)]\s*\S|\d+[.)、]\s+\S)/.test(s)) return true;
        if (/[:：]$/.test(s) && isTitleHeading(s)) return true;
        if (/^[A-Z\u4e00-\u9fff][^,\n]{0,60}[:：]\s+[A-Z\u4e00-\u9fff]/.test(s) && isTitleHeading(s.split(/[:：]/)[0])) return true;
        if (!/[.!?。！？]$/.test(s) && isTitleHeading(s)) return true;
        return false;
      }

      function unwrapLines(text) {
        return normalizeNewlines(text).split(/\n{2,}/).map(function (block) {
          var rows = block.split("\n").map(function (l) { return l.replace(/[ \t]+$/g, ""); });
          if (rows.length <= 1) return rows.join("");
          var out = rows[0].replace(/^\s+/, "");
          for (var i = 1; i < rows.length; i++) {
            var curr = rows[i].replace(/^\s+/, "");
            if (!curr) continue;
            var last = out.split("\n").pop();
            if (looksLikeHeading(curr) || looksLikeHeading(last) || looksLikeBlockStart(curr)) {
              out += "\n" + curr;
              continue;
            }
            var joiner = /[-–—]$/.test(last) ? "" : " ";
            var hard = /[.!?…:;"'”’）)\]】》」』。！？：；、，]$/.test(last);
            out += (hard && /^[A-Z\u4e00-\u9fff“"‘']/.test(curr) ? " " : joiner) + curr;
          }
          return out;
        }).join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
      }

      function countMeta(text) {
        var t = normalizeNewlines(text);
        return t.length + " 字 · " + (t === "" ? 0 : t.split("\n").length) + " 行";
      }
      function updateMeta() {
        $("inputMeta").textContent = countMeta(inputEl.value);
        $("outputMeta").textContent = countMeta(outputEl.value);
      }
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2000);
      }
      function resetSession(nextSnapshot) {
        hasPipeline = false;
        inputSnapshot = nextSnapshot == null ? inputEl.value : nextSnapshot;
        aiDecorations = [];
        history = [];
        updateUndoBtn();
      }

      function updateUndoBtn() {
        $("undoBtn").disabled = history.length === 0;
      }

      function pushHistory() {
        history.push({
          output: outputEl.value,
          aiDecorations: aiDecorations.slice(),
          hasPipeline: hasPipeline
        });
        if (history.length > 80) history.shift();
        updateUndoBtn();
      }

      function undo() {
        if (!history.length) {
          showToast("没有可撤回的操作");
          return;
        }
        var prev = history.pop();
        outputEl.value = prev.output;
        aiDecorations = prev.aiDecorations.slice();
        hasPipeline = prev.output !== "";
        updateUndoBtn();
        updateMeta();
      }

      function collapseBlankLines(text) {
        return linesOf(text).filter(function (line) { return !isBlankLine(line); }).join("\n").trim();
      }
      function collapseSpaces(text) {
        return mapLines(text, function (line) { return trimLine(line.replace(/[ \t]+/g, " ")); });
      }

      function peelLine(line) {
        var leadWs = (line.match(/^[ \t\u3000]*/) || [""])[0];
        var s = line.slice(leadWs.length);
        var prefix = "", guard = 0, hit, i, m;
        while (guard++ < 8) {
          hit = null;
          for (i = 0; i < PREFIX_RES.length; i++) {
            m = s.match(PREFIX_RES[i]);
            if (m) { hit = m[0]; break; }
          }
          if (!hit) break;
          prefix += hit;
          s = s.slice(hit.length);
        }
        var wrapOpen = "", wrapClose = "";
        var wrapped = s.match(/^\*\*(.+?)\*\*\s*$/) || s.match(/^__(.+?)__\s*$/) || s.match(/^`(.+?)`\s*$/);
        if (wrapped) {
          wrapOpen = wrapClose = s.charAt(0) === "*" ? "**" : s.charAt(0) === "_" ? "__" : "`";
          s = wrapped[1];
        }
        return { leadWs: leadWs, prefix: prefix, wrapOpen: wrapOpen, wrapClose: wrapClose, body: s };
      }

      function rememberAiDecorations(text) {
        aiDecorations = linesOf(text).map(peelLine).filter(function (d) {
          return d.body.replace(/\s+/g, "") !== "" && (d.prefix || d.wrapOpen);
        });
      }

      function restoreAiMarkers(text) {
        var lines = linesOf(text);
        var pool = aiDecorations.slice();
        var used = 0;
        var restored = lines.map(function (line) {
          var peeled = peelLine(line);
          if (peeled.prefix || peeled.wrapOpen) return line;
          var key = normKey(line);
          if (!key) return line;
          for (var i = 0; i < pool.length; i++) {
            if (pool[i] && normKey(pool[i].body) === key) {
              var d = pool[i];
              pool[i] = null;
              used += 1;
              return d.leadWs + d.prefix + d.wrapOpen + line.replace(/^[ \t\u3000]+/, "") + d.wrapClose;
            }
          }
          return line;
        });
        if (used) return restored.join("\n");
        var n = 1;
        return lines.map(function (line) {
          if (!line.trim() || looksLikeBlockStart(line.replace(/^\s+/, ""))) return line;
          return n++ + ". " + line.replace(/^\s+/, "");
        }).join("\n");
      }

      function cleanAiMarkers(text) {
        var cleaned = mapLines(text, function (line) { return peelLine(line).body; });
        return cleaned
          .replace(/\*\*(.+?)\*\*/g, "$1")
          .replace(/__(.+?)__/g, "$1")
          .replace(/`([^`]+)`/g, "$1")
          .replace(/^[ \t]*[-*]{3,}[ \t]*$/gm, "")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function parseCnOrdinal(raw) {
        if (!raw) return NaN;
        if (/^[0-9０-９]+$/.test(raw)) {
          return parseInt(raw.replace(/[０-９]/g, function (d) { return String(d.charCodeAt(0) - 0xFF10); }), 10);
        }
        if (raw === "十") return 10;
        if (raw.length === 2 && raw[0] === "十") return 10 + (CN_NUM[raw[1]] || 0);
        if (raw.length === 2 && raw[1] === "十") return (CN_NUM[raw[0]] || 0) * 10;
        if (raw.length === 3 && raw[1] === "十") return (CN_NUM[raw[0]] || 0) * 10 + (CN_NUM[raw[2]] || 0);
        if (raw.length === 1 && CN_NUM[raw] != null) return CN_NUM[raw];
        var n = 0, i;
        for (i = 0; i < raw.length; i++) {
          if (CN_NUM[raw[i]] == null) return NaN;
          n = n * 10 + CN_NUM[raw[i]];
        }
        return n || NaN;
      }

      function insertBreaksBefore(text, indexes) {
        if (!indexes.length) return text;
        var uniq = {}, i;
        for (i = 0; i < indexes.length; i++) if (indexes[i] > 0) uniq[indexes[i]] = true;
        var out = "";
        for (i = 0; i < text.length; i++) {
          if (uniq[i]) {
            out = out.replace(/[ \t\u3000]+$/, "");
            if (out && out.slice(-1) !== "\n") out += "\n";
          }
          out += text[i];
        }
        return out;
      }

      function findAll(text, re, fn) {
        var out = [], m, item;
        re.lastIndex = 0;
        while ((m = re.exec(text))) {
          item = fn(m, text);
          if (item != null) out.push(item);
        }
        return out;
      }

      function sequentialBreaks(candidates) {
        var marks = [], i = 0, j, k;
        while (i < candidates.length) {
          var run = [candidates[i]];
          j = i + 1;
          while (j < candidates.length && candidates[j].num === run[run.length - 1].num + 1) {
            run.push(candidates[j]);
            j++;
          }
          if (run.length >= 2) {
            for (k = 0; k < run.length; k++) marks.push(run[k].index);
            i = j;
          } else i += 1;
        }
        return marks;
      }

      function splitSequential(text, re, toCand) {
        return insertBreaksBefore(text, sequentialBreaks(findAll(text, re, toCand)));
      }

      function splitIfMany(text, re, keep) {
        var idxs = findAll(text, re, function (m, src) {
          var v = keep(m, src);
          if (v === true) return m.index;
          if (typeof v === "number" && v > 0) return v;
          return null;
        });
        return idxs.length >= 2 ? insertBreaksBefore(text, idxs) : text;
      }

      function notAtLineStart(m, src) {
        return m.index > 0 && src.charAt(m.index - 1) !== "\n";
      }

      // 空格、标点后可分段；英数和 . _ 中间禁止切开。
      function isSoftBoundary(src, index) {
        if (index <= 0) return false;
        var prev = src.charAt(index - 1);
        if (prev === "\n") return false;
        return /[\s\u3000。！？!?…；;：:、，,）)\]】》」』"'”’]/.test(prev);
      }

      // 序号/小标题：允许紧贴中文（如「准备二、实施」），但不切开英文单词或数字。
      function isListMarkerBoundary(src, index) {
        if (index <= 0) return true;
        var prev = src.charAt(index - 1);
        if (prev === "\n") return false;
        if (/[A-Za-z0-9._]/.test(prev)) return false;
        return true;
      }

      function smartSegment(text) {
        var t = normalizeNewlines(text).replace(/\t+/g, "\n");

        t = splitSequential(t, /[0-9]{1,2}[.．、)](?!\d)/g, function (m, src) {
          if (!isListMarkerBoundary(src, m.index)) return null;
          if (m.index > 0 && /[\d.]/.test(src.charAt(m.index - 1))) return null;
          return { index: m.index, num: parseInt(m[0], 10) };
        });
        t = splitSequential(t, /[（(]([0-9]{1,2}|[一二三四五六七八九十]{1,3})[）)]/g, function (m, src) {
          if (!isListMarkerBoundary(src, m.index)) return null;
          var num = parseCnOrdinal(m[1]);
          return isNaN(num) ? null : { index: m.index, num: num };
        });
        t = splitSequential(t, /([一二三四五六七八九十]{1,3})[、.．]/g, function (m, src) {
          if (m.index > 0 && /[第其]/.test(src.charAt(m.index - 1))) return null;
          if (!isListMarkerBoundary(src, m.index)) return null;
          var num = parseCnOrdinal(m[1]);
          return isNaN(num) ? null : { index: m.index, num: num };
        });
        t = splitSequential(t, /第([一二三四五六七八九十百千零〇两]+|[0-9]{1,3})(?![A-Za-z0-9])/g, function (m, src) {
          if (!isListMarkerBoundary(src, m.index)) return null;
          var num = parseCnOrdinal(m[1]);
          return isNaN(num) ? null : { index: m.index, num: num };
        });

        t = splitIfMany(t, /#{1,6}[ \t]+\S/g, function (m, src) {
          return notAtLineStart(m, src) && isListMarkerBoundary(src, m.index);
        });
        t = splitIfMany(t, /[-*+•●○▪►▶]\s+\S/g, function (m, src) {
          return notAtLineStart(m, src) && isSoftBoundary(src, m.index) ? m.index : null;
        });
        t = splitIfMany(t, KEYWORD_RE, function (m, src) {
          return notAtLineStart(m, src) && isSoftBoundary(src, m.index);
        });

        t = t.replace(/([A-Z\u4e00-\u9fff][^,\n;；，]{0,55}[:：])\s+(?=[A-Z\u4e00-\u9fff])/g, function (full, heading, offset, src) {
          if (/\d[:：]\d/.test(heading)) return full;
          if (offset > 0 && /[A-Za-z0-9]/.test(src.charAt(offset - 1))) return full;
          if (offset > 0 && src.charAt(offset - 1) !== "\n" && !isSoftBoundary(src, offset) && !/[\u4e00-\u9fff]/.test(src.charAt(offset - 1))) return full;
          if (!isTitleHeading(heading)) return full;
          return heading + "\n";
        });

        t = mapLines(t, function (line) {
          var hits = findAll(line, /[A-Za-z\u4e00-\u9fff]{1,8}[：:]/g, function (m, src) {
            if (m.index > 0 && !isSoftBoundary(src, m.index)) return null;
            return m.index;
          });
          return hits.length < 2 ? line : insertBreaksBefore(line, hits);
        });

        return mapLines(t, function (line) { return trimLine(compactSpaces(line)); }).replace(/\n{3,}/g, "\n\n").trim();
      }

      function pipelineAll(text, chained) {
        var t = smartSegment(chained ? text : unwrapLines(text));
        rememberAiDecorations(t);
        return collapseBlankLines(collapseSpaces(cleanAiMarkers(t)));
      }

      function currentSource() {
        return hasPipeline && outputEl.value !== "" ? outputEl.value : inputEl.value;
      }

      function run(action) {
        var chained = hasPipeline && outputEl.value !== "";
        var source = currentSource();
        if (!source.trim()) {
          showToast("请先粘贴或输入文本");
          inputEl.focus();
          return;
        }
        var fn = {
          blank: collapseBlankLines,
          spaces: collapseSpaces,
          unwrap: unwrapLines,
          ai: function (t) { rememberAiDecorations(t); return cleanAiMarkers(t); },
          "restore-ai": restoreAiMarkers,
          segment: smartSegment,
          all: function (t) { return pipelineAll(t, chained); }
        }[action];
        pushHistory();
        outputEl.value = fn ? fn(source) : source;
        hasPipeline = true;
        inputSnapshot = inputEl.value;
        updateMeta();
      }

      [
        ["blank", "去除多余空行"],
        ["spaces", "去除多余空格"],
        ["unwrap", "取消 / 合并换行"],
        ["ai", "清理 AI 符号 / 序号"],
        ["restore-ai", "恢复 AI 符号 / 序号"],
        ["segment", "智能分段"],
        ["all", "一键全部清理"]
      ].forEach(function (item) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = item[1];
        btn.className = item[0] === "all" ? BTN_PRIMARY : BTN;
        btn.addEventListener("click", function () { run(item[0]); });
        $("actionBar").appendChild(btn);
      });

      applyTheme(localStorage.getItem("tc-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      function applyTheme(theme) {
        root.classList.toggle("dark", theme === "dark");
        localStorage.setItem("tc-theme", theme);
      }
      $("themeToggle").addEventListener("click", function () {
        applyTheme(root.classList.contains("dark") ? "light" : "dark");
      });

      $("undoBtn").addEventListener("click", undo);

      $("clearBtn").addEventListener("click", function () {
        inputEl.value = "";
        outputEl.value = "";
        resetSession("");
        updateMeta();
        inputEl.focus();
      });

      $("pasteBtn").addEventListener("click", function () {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          showToast("浏览器不支持读取剪贴板，请手动粘贴");
          inputEl.focus();
          return;
        }
        navigator.clipboard.readText().then(function (text) {
          inputEl.value = text;
          resetSession(text);
          updateMeta();
          showToast("已从剪贴板粘贴");
        }).catch(function () {
          showToast("无法读取剪贴板，请允许权限或手动粘贴");
          inputEl.focus();
        });
      });

      $("copyBtn").addEventListener("click", function () {
        var text = outputEl.value;
        if (!text) { showToast("还没有可复制的内容"); return; }
        function done() { showToast("已复制"); }
        function fallback() {
          outputEl.focus();
          outputEl.select();
          try { document.execCommand("copy"); done(); }
          catch (e) { showToast("复制失败，请手动选择文本"); }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else fallback();
      });

      inputEl.addEventListener("input", function () {
        if (inputEl.value !== inputSnapshot) resetSession();
        updateMeta();
      });
      outputEl.addEventListener("input", function () {
        hasPipeline = outputEl.value !== "";
        updateMeta();
      });
      updateMeta();
    })();
  </script>
</body>
</html>
